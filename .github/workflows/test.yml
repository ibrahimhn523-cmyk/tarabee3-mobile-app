name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate project (XcodeGen)
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          xcodebuild -version
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]:
                      print(d["udid"]); sys.exit()
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Test (unit + snapshots)
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: |
          xcodebuild test -quiet \
            -project Tarabee3.xcodeproj -scheme Tarabee3 \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" --compact 2>/dev/null \
            || xcrun xcresulttool get --legacy --format json --path "$RUNNER_TEMP/Tests.xcresult" | head -c 4000
          ls -la "$RUNNER_TEMP/snapshots" || true

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
          retention-days: 30
