name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # التوقيع والرفع لا يعملان إلا والأسرار الأربعة موجودة؛ وبدونها يُبنى أرشيف بلا توقيع
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: |
          xcodebuild -version
          echo "التوقيع والرفع: $HAS_SIGNING"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Tarabee3.xcarchive" >> "$GITHUB_ENV"

      # ملف إعداد فايربيس لا يدخل المستودع العام (القرار الرابع في M-02): يُكتب من خزنة قِت هب وقت البناء.
      # وبدونه يُبنى التطبيق، ويعرض «غير مهيّأ» عند فتحه.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Tarabee3/GoogleService-Info.plist
            echo "ملف إعداد فايربيس: موجود"
          else
            echo "ملف إعداد فايربيس: غائب"
          fi

      - name: Generate project (XcodeGen)
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          # إصدار مقفل ومتحقَّق من بصمته، لا أحدث ما في brew
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip"             "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Write signing key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # خارج مجلد المستودع، ويُحذف في آخر خطوة
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -quiet \
            -project Tarabee3.xcodeproj -scheme Tarabee3 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Archive (unsigned — no Apple secrets yet)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild archive -quiet \
            -project Tarabee3.xcodeproj -scheme Tarabee3 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          ls -la "$ARCHIVE_PATH/Products/Applications"

      - name: Export and upload to App Store Connect
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove signing key and Firebase config
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" Tarabee3/GoogleService-Info.plist

      - name: Build number and step durations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "رقم البناء: $BUILD_NUMBER"
          xcodebuild -version
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '
            .jobs[] | select(.name == "build") | .steps[]
            | select(.completed_at != null and .started_at != null)
            | "\(.name): \((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) ث — \(.conclusion)"'
