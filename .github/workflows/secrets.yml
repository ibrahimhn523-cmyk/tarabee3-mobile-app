name: Secrets scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$BASE/$TAR"
          curl -sSfLO "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $TAR\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$TAR" gitleaks

      # اختبار آلي باقٍ (القاعدة ٤): الفاحص نفسه يكشف ما نخاف منه.
      # المفاتيح الوهمية تُولَّد وقت التشغيل خارج المستودع، فلا تدخل السجلّ ولا تمنعها حماية الدفع.
      - name: Self-test — scanner catches fake keys
        run: |
          T="$RUNNER_TEMP/selftest"
          mkdir -p "$T/p8" "$T/sa" "$T/p8b64"
          # مفتاح يُرمى: بصيغة ملف .p8 من آبل نفسها، يُولَّد هنا ولا يخصّ أي حساب
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$T/p8/AuthKey_TEST.p8"
          # بصيغة ملف خدمة فايربيس
          jq -n --rawfile k "$T/p8/AuthKey_TEST.p8" \
            '{type: "service_account", project_id: "selftest", private_key: $k}' > "$T/sa/service-account.json"
          # بالترميز نفسه الذي يُخزَّن به سرّ ASC_KEY_P8_BASE64
          base64 -w0 "$T/p8/AuthKey_TEST.p8" > "$T/p8b64/key.txt"
          for d in p8 sa p8b64; do
            if "$RUNNER_TEMP/gitleaks" dir "$T/$d" --redact --no-banner --exit-code 1; then
              echo "::error::الفاحص لم يكشف المفتاح الوهمي في $d"
              exit 1
            fi
            echo "كُشف المفتاح الوهمي في $d"
          done
          rm -rf "$T"

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
