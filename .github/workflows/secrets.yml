name: Secrets scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$BASE/$TAR"
          curl -sSfLO "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $TAR\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$TAR" gitleaks

      - name: Scan full history
        run: "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
