# يُولَّد منه مشروع Xcode على جهاز قِت هب: xcodegen generate
name: Tarabee3

options:
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  # Firebase Apple SDK 13 (04-tech): الهوية وقراءة Firestore. مقفل على إصدار بعينه.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.0.1

targets:
  Tarabee3:
    type: application
    platform: iOS
    sources:
      - path: Tarabee3
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Tarabee3/Info.plist
      properties:
        CFBundleDisplayName: ترابيع
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # ريديكس برو متغيّر الوزن، يُشحن مع التطبيق (05-ui §٢)
        UIAppFonts:
          - ReadexPro-Variable.ttf
        # خادم ترابيع — عنوان عام، ليس سرّاً
        ServerBaseURL: https://tarabee3-mobile.tarabee3-worker.workers.dev
    settings:
      base:
        # مؤقت حتى يصل معرّف الحزمة من الخطوة ب
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tarabee3
        # آيفون وحده؛ الآيباد يشغّله بتصميم الجوال (القرار 0004)
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        # يُستبدل في قِت هب برقم التشغيل GITHUB_RUN_NUMBER
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  Tarabee3Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tarabee3Tests
    dependencies:
      - target: Tarabee3
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tarabee3.tests

schemes:
  Tarabee3:
    build:
      targets:
        Tarabee3: all
        Tarabee3Tests: [test]
    test:
      targets:
        - Tarabee3Tests
    archive:
      config: Release
