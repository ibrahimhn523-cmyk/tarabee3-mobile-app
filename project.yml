# يُولَّد منه مشروع Xcode على جهاز قِت هب: xcodegen generate
name: Tarabee3

options:
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Tarabee3:
    type: application
    platform: iOS
    sources:
      - Tarabee3
    info:
      path: Tarabee3/Info.plist
      properties:
        CFBundleDisplayName: ترابيع
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # مؤقت حتى يصل معرّف الحزمة من الخطوة ب
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tarabee3
        # آيفون وحده؛ الآيباد يشغّله بتصميم الجوال (القرار 0004)
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        # يُستبدل في قِت هب برقم التشغيل GITHUB_RUN_NUMBER
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

schemes:
  Tarabee3:
    build:
      targets:
        Tarabee3: all
    archive:
      config: Release
